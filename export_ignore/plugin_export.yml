export_root: "res://addons/git_view/export_ignore/exports"
plugin_folder: "GitView{{version=git_view}}"
pre_script: ""
post_script: ""
options:
  overwrite: true
  include_uid: true
  include_import: true
  ignore_src: true
  use_tag_in_cfg: true
  include_min_version: true
  move_global_files: true
  parser_settings:
    parse_cs:
      namespace_rename: {}
    parse_gd:
      reduce_access_paths: true
      class_rename_ignore: []
    parse_tscn: {}
    parse_tres: {}
exports:
  -
    source: "res://addons/git_view"
    export_name: "git-view{{version=git_view}}"
    export_folder: "addons/git_view"
